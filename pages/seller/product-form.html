
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add / Edit Product - Artisan</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="../../index.html" class="brand">
                <span class="brand-mark">A</span>
                <span class="brand-name">Artisan Studio</span>
            </a>
            <nav class="main-nav">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="products.html" class="nav-link">My Products</a>
                <button class="btn btn-secondary" onclick="AuthController.logout()">Logout</button>
            </nav>
        </div>
    </header>

    <main class="section">
        <div class="container" style="max-width: 600px;">
            <div class="metric-card">
                <h2 id="formTitle">Add New Product</h2>
                <p style="margin-bottom: 24px; color: var(--color-text-muted);">List a handcrafted product on the marketplace.</p>

                <form id="productForm">
                    <input type="hidden" id="productId">

                    <div class="form-group">
                        <label class="form-label" for="productName">Product Name</label>
                        <input type="text" id="productName" class="form-control" required placeholder="e.g. Handwoven Cotton Shawl">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="category">Category</label>
                        <select id="category" class="form-control" required>
                            <option value="Handicrafts">Handicrafts</option>
                            <option value="Food">Food</option>
                            <option value="Baked Goods">Baked Goods</option>
                            <option value="Jewelry">Jewelry</option>
                            <option value="Clothing">Clothing</option>
                            <option value="Home Decor">Home Decor</option>
                            <option value="Beauty">Beauty & Personal Care</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group">
                            <label class="form-label" for="price">Price (₹)</label>
                            <input type="number" id="price" class="form-control" min="1" step="0.01" required placeholder="499">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="stock">Stock Quantity</label>
                            <input type="number" id="stock" class="form-control" min="1" required value="10">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="description">Description</label>
                        <textarea id="description" class="form-control" rows="4" required placeholder="Describe materials, craft technique, or ingredients..."></textarea>
                    </div>

                    <div style="display: flex; gap: 12px; margin-top: 20px;">
                        <a href="products.html" class="btn btn-secondary" style="flex: 1; text-align: center;">Cancel</a>
                        <button type="submit" class="btn btn-primary" style="flex: 2;">Save Product</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../../js/core/utils.js"></script>
    <script src="../../js/data/storage.js"></script>
    <script src="../../js/data/seed-loader.js"></script>
    <script src="../../js/data/data-service.js"></script>
    <script src="../../js/auth/session.js"></script>
    <script src="../../js/auth/auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const user = SessionManager.getUser();
            if (!user || user.role !== "seller") {
                window.location.href = "../auth/login.html";
                return;
            }

            const seller = DataService.getSellerByUserId(user.id);
            if (!seller) return;

            const urlParams = new URLSearchParams(window.location.search);
            const editId = urlParams.get("id");

            if (editId) {
                const existing = DataService.getProductById(editId);
                if (!existing || existing.sellerId !== seller.id) {
                    // Not found, or belongs to a different seller — do not allow editing.
                    window.location.href = "products.html";
                    return;
                }
                document.getElementById("formTitle").textContent = "Edit Product";
                document.getElementById("productId").value = existing.id;
                document.getElementById("productName").value = existing.name;
                document.getElementById("category").value = existing.category;
                document.getElementById("price").value = existing.price;
                document.getElementById("stock").value = existing.stock || 10;
                document.getElementById("description").value = existing.description || "";
            }

            document.getElementById("productForm").addEventListener("submit", (e) => {
                e.preventDefault();

                const pId = document.getElementById("productId").value;
                const productData = {
                    sellerId: seller.id,
                    name: document.getElementById("productName").value,
                    category: document.getElementById("category").value,
                    price: parseFloat(document.getElementById("price").value),
                    stock: parseInt(document.getElementById("stock").value, 10),
                    description: document.getElementById("description").value,
                    image: `assets/products/default-${document.getElementById("category").value.toLowerCase().replace(/\s+/g, '-')}.jpg`
                };

                if (pId) {
                    const products = StorageEngine.get("artisan_products", []);
                    const idx = products.findIndex(p => p.id === pId && p.sellerId === seller.id);
                    if (idx > -1) {
                        products[idx] = { ...products[idx], ...productData };
                        StorageEngine.set("artisan_products", products);
                    } else {
                        alert("You do not have permission to edit this product.");
                        return;
                    }
                } else {
                    DataService.createProduct(productData);
                }

                window.location.href = "products.html";
            });
        });
    </script>
</body>
</html>

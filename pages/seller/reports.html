<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Reports - Artisan</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="../../index.html" class="brand">
                <span class="brand-mark">A</span>
                <span class="brand-name">Artisan Studio</span>
            </a>
            <nav class="main-nav">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="products.html" class="nav-link">My Products</a>
                <a href="analytics.html" class="nav-link">Analytics</a>
                <a href="reports.html" class="nav-link active">Reports</a>
                <button class="btn btn-secondary" onclick="AuthController.logout()">Logout</button>
            </nav>
        </div>
    </header>

    <main class="section">
        <div class="container">
            <h2>Transaction Reports</h2>
            <p style="margin-bottom: 24px; color: var(--color-text-muted);">Generate, filter, and export detailed sales statements.</p>

            <div class="metric-card" style="margin-bottom: 24px;">
                <div style="display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end;">
                    <div class="form-group" style="margin:0; flex: 1; min-width: 150px;">
                        <label class="form-label" for="startDate">From Date</label>
                        <input type="date" id="startDate" class="form-control">
                    </div>
                    <div class="form-group" style="margin:0; flex: 1; min-width: 150px;">
                        <label class="form-label" for="endDate">To Date</label>
                        <input type="date" id="endDate" class="form-control">
                    </div>
                    <button id="btnFilter" class="btn btn-primary">Filter</button>
                    <button id="btnExportCSV" class="btn btn-secondary">Export CSV</button>
                    <button id="btnExportPDF" class="btn btn-secondary">Print / PDF</button>
                </div>
            </div>

            <div class="metric-card" id="reportTableArea">
                <table style="width: 100%; text-align: left; border-collapse: collapse;">
                    <thead>
                        <tr style="border-bottom: 2px solid var(--color-border); font-size: 0.88rem; color: var(--color-text-muted);">
                            <th style="padding: 10px;">Order ID</th>
                            <th style="padding: 10px;">Date</th>
                            <th style="padding: 10px;">Product</th>
                            <th style="padding: 10px;">Qty</th>
                            <th style="padding: 10px;">Payment Method</th>
                            <th style="padding: 10px;">Total</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="../../js/core/utils.js"></script>
    <script src="../../js/data/storage.js"></script>
    <script src="../../js/data/data-service.js"></script>
    <script src="../../js/auth/session.js"></script>
    <script src="../../js/auth/auth.js"></script>
    <script src="../../js/reports/reports.js"></script>
    <script src="../../js/reports/excel-export.js"></script>
    <script src="../../js/reports/pdf-export.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const user = SessionManager.getUser();
            if (!user || user.role !== "seller") {
                window.location.href = "../auth/login.html";
                return;
            }
            const seller = DataService.getSellerByUserId(user.id);
            if (!seller) return;

            let currentData = [];

            function render() {
                const start = document.getElementById("startDate").value;
                const end = document.getElementById("endDate").value;
                currentData = ReportEngine.getFilteredOrders(seller.id, start, end);

                const tbody = document.getElementById("reportTableBody");
                if (currentData.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 20px;">No transaction records found for selected dates.</td></tr>`;
                    return;
                }

                tbody.innerHTML = currentData.map(r => `
                    <tr>
                        <td style="padding: 12px; border-bottom: 1px solid var(--color-border);">${escapeHTML(r.orderId)}</td>
                        <td style="padding: 12px; border-bottom: 1px solid var(--color-border);">${r.date}</td>
                        <td style="padding: 12px; border-bottom: 1px solid var(--color-border);">${escapeHTML(r.productName)}</td>
                        <td style="padding: 12px; border-bottom: 1px solid var(--color-border);">${r.quantity}</td>
                        <td style="padding: 12px; border-bottom: 1px solid var(--color-border);">${escapeHTML(r.paymentMethod)}</td>
                        <td style="padding: 12px; border-bottom: 1px solid var(--color-border);"><strong>${formatCurrency(r.subtotal)}</strong></td>
                    </tr>
                `).join("");
            }

            document.getElementById("btnFilter").addEventListener("click", render);
            document.getElementById("btnExportCSV").addEventListener("click", () => {
                ExcelExporter.exportToCSV(`Sales_Report_${seller.id}`, currentData);
            });
            document.getElementById("btnExportPDF").addEventListener("click", () => {
                PDFExporter.exportElementAsPDF("reportTableArea", "Sales & Transaction Report");
            });

            render();
        });
    </script>
</body>
</html>

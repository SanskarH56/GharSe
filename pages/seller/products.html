<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Products - Artisan</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="../../index.html" class="brand">
                <span class="brand-mark">A</span>
                <span class="brand-name">Artisan Studio</span>
            </a>
            <nav class="main-nav">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="products.html" class="nav-link active">My Products</a>
                <button class="btn btn-secondary" onclick="AuthController.logout()">Logout</button>
            </nav>
        </div>
    </header>

    <main class="section">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <div>
                    <h2>My Product Listings</h2>
                    <p style="color: var(--color-text-muted);">Manage your active products and inventory.</p>
                </div>
            </div>

            <div id="sellerProductsContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px;">
                <!-- Dynamically rendered -->
            </div>
        </div>
    </main>

    <script src="../../js/core/utils.js"></script>
    <script src="../../js/data/storage.js"></script>
    <script src="../../js/data/data-service.js"></script>
    <script src="../../js/auth/session.js"></script>
    <script src="../../js/auth/auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const user = SessionManager.getUser();
            if (!user || user.role !== "seller") {
                window.location.href = "../auth/login.html";
                return;
            }

            const seller = DataService.getSellerByUserId(user.id);
            if (!seller) return;

            function render() {
                const products = DataService.getProductsBySeller(seller.id);
                const container = document.getElementById("sellerProductsContainer");

                if (products.length === 0) {
                    container.innerHTML = `<p style="grid-column: 1 / -1;">No products found for your store.</p>`;
                    return;
                }

                container.innerHTML = products.map(product => `
                    <div class="metric-card">
                        <span class="badge badge-success">${escapeHTML(product.category)}</span>
                        <h4 style="margin-top: 10px;">${escapeHTML(product.name)}</h4>
                        <strong style="color: var(--color-primary);">${formatCurrency(product.price)}</strong>
                        <div style="margin-top: 14px; display: flex; gap: 8px;">
                            <button class="btn btn-secondary" style="flex: 1; padding: 6px; color: var(--color-error);" onclick="deleteItem('${product.id}')">Delete</button>
                        </div>
                    </div>
                `).join("");
            }

            window.deleteItem = function(id) {
                if (confirm("Are you sure you want to remove this product?")) {
                    DataService.deleteProduct(id);
                    render();
                }
            };

            render();
        });
    </script>
</body>
</html


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Analytics - Artisan</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="../../index.html" class="brand">
                <span class="brand-mark">A</span>
                <span class="brand-name">Artisan Studio</span>
            </a>
            <nav class="main-nav" aria-label="Main navigation"></nav>
            <button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-label="Open navigation menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main class="section">
        <div class="container">
            <h2>Sales Analytics</h2>
            <p style="margin-bottom: 24px; color: var(--color-text-muted);">In-depth breakdown of your products, items sold, and top categories.</p>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px;">
                <div class="metric-card">
                    <span style="font-size: 0.85rem; color: var(--color-text-muted);">Total Revenue</span>
                    <h3 id="analyticsRevenue" style="font-size: 1.8rem; margin-top: 6px; color: var(--color-primary);">₹0.00</h3>
                </div>
                <div class="metric-card">
                    <span style="font-size: 0.85rem; color: var(--color-text-muted);">Units Sold</span>
                    <h3 id="analyticsUnits" style="font-size: 1.8rem; margin-top: 6px;">0</h3>
                </div>
                <div class="metric-card">
                    <span style="font-size: 0.85rem; color: var(--color-text-muted);">Completed Orders</span>
                    <h3 id="analyticsOrders" style="font-size: 1.8rem; margin-top: 6px;">0</h3>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 24px;">
                <div class="metric-card">
                    <h3 style="margin-bottom: 16px;">Top Performing Products</h3>
                    <table style="width: 100%; text-align: left; border-collapse: collapse;">
                        <thead>
                            <tr style="border-bottom: 2px solid var(--color-border); font-size: 0.88rem; color: var(--color-text-muted);">
                                <th style="padding: 10px;">Product Name</th>
                                <th style="padding: 10px;">Units</th>
                                <th style="padding: 10px;">Revenue</th>
                            </tr>
                        </thead>
                        <tbody id="topProductsContainer"></tbody>
                    </table>
                </div>

                <div class="metric-card" style="height: fit-content;">
                    <h3 style="margin-bottom: 16px;">Sales by Category</h3>
                    <div id="categoryPerformanceContainer"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="../../js/core/utils.js"></script>
    <script src="../../js/data/storage.js"></script>
    <script src="../../js/data/seed-loader.js"></script>
    <script src="../../js/data/data-service.js"></script>
    <script src="../../js/auth/session.js"></script>
    <script src="../../js/auth/auth.js"></script>
    <script src="../../js/cart/cart.js"></script>
    <script src="../../js/nav/navigation.js"></script>
    <script src="../../js/core/app.js"></script>
    <script src="../../js/analytics/seller-analytics.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const user = SessionManager.getUser();
            if (!user || user.role !== "seller") {
                window.location.href = "../auth/login.html";
                return;
            }
            const seller = DataService.getSellerByUserId(user.id);
            if (seller) SellerAnalytics.renderDashboard(seller.id);
        });
    </script>
</body>
</html>

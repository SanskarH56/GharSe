<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard - Artisan</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="../../index.html" class="brand">
                <span class="brand-mark">A</span>
                <span class="brand-name">Artisan Studio</span>
            </a>
            <nav class="main-nav">
                <a href="dashboard.html" class="nav-link active">Dashboard</a>
                <a href="products.html" class="nav-link">My Products</a>
                <a href="../marketplace/marketplace.html" class="nav-link">Marketplace</a>
                <button class="btn btn-secondary" onclick="AuthController.logout()">Logout</button>
            </nav>
        </div>
    </header>

    <main class="section">
        <div class="container">
            <h2>Seller Workspace</h2>
            <p style="margin-bottom: 24px; color: var(--color-text-muted);">Track your store metrics, sales, and products.</p>

            <!-- Metric Cards -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px;">
                <div class="metric-card">
                    <span style="font-size: 0.85rem; color: var(--color-text-muted);">Total Revenue</span>
                    <h3 id="metricRevenue" style="font-size: 1.8rem; margin-top: 6px; color: var(--color-primary);">₹0.00</h3>
                </div>
                <div class="metric-card">
                    <span style="font-size: 0.85rem; color: var(--color-text-muted);">Units Sold</span>
                    <h3 id="metricUnits" style="font-size: 1.8rem; margin-top: 6px;">0</h3>
                </div>
                <div class="metric-card">
                    <span style="font-size: 0.85rem; color: var(--color-text-muted);">Active Products</span>
                    <h3 id="metricProducts" style="font-size: 1.8rem; margin-top: 6px;">0</h3>
                </div>
            </div>

            <!-- Recent Orders -->
            <div class="metric-card">
                <h3 style="margin-bottom: 16px;">Recent Sales</h3>
                <table style="width: 100%; text-align: left; border-collapse: collapse;">
                    <thead>
                        <tr style="border-bottom: 2px solid var(--color-border); font-size: 0.88rem; color: var(--color-text-muted);">
                            <th style="padding: 10px;">Order ID</th>
                            <th style="padding: 10px;">Product</th>
                            <th style="padding: 10px;">Qty</th>
                            <th style="padding: 10px;">Subtotal</th>
                        </tr>
                    </thead>
                    <tbody id="recentOrdersContainer">
                        <!-- Populated dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="../../js/core/utils.js"></script>
    <script src="../../js/data/storage.js"></script>
    <script src="../../js/data/data-service.js"></script>
    <script src="../../js/auth/session.js"></script>
    <script src="../../js/auth/auth.js"></script>
    <script src="../../js/pages/seller-dashboard.js"></script>
</body>
</html>

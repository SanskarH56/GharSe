
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Artisan Marketplace</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="../../index.html" class="brand">
                <span class="brand-mark">A</span>
                <span class="brand-name">Artisan</span>
            </a>
        </div>
    </header>

    <main class="section">
        <div class="container" style="max-width: 500px;">
            <div class="metric-card">
                <h2 style="font-size: 1.8rem; margin-bottom: 8px;">Create account</h2>
                <p style="margin-bottom: 24px;">Join Artisan to support or build independent businesses.</p>

                <div id="authAlert" style="display: none; padding: 10px 14px; margin-bottom: 16px; border-radius: 8px; background: #fbeae8; color: var(--color-error); font-size: 0.88rem;"></div>

                <form id="signupForm">
                    <div class="form-group">
                        <label class="form-label">I want to...</label>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <label style="padding: 12px; border: 1px solid var(--color-border); border-radius: var(--radius-small); cursor: pointer; text-align: center;">
                                <input type="radio" name="role" value="buyer" checked style="margin-right: 6px;"> Discover & Buy
                            </label>
                            <label style="padding: 12px; border: 1px solid var(--color-border); border-radius: var(--radius-small); cursor: pointer; text-align: center;">
                                <input type="radio" name="role" value="seller" style="margin-right: 6px;"> Start Selling
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" id="name" class="form-control" required placeholder="Anita Sharma">
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" id="email" class="form-control" required placeholder="name@example.com">
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" required placeholder="Create a password">
                    </div>

                    <button type="submit" class="btn btn-primary btn-large" style="width: 100%; margin-top: 10px;">Create Account</button>
                </form>

                <p style="margin-top: 20px; text-align: center; font-size: 0.9rem;">
                    Already have an account? <a href="login.html" class="text-link">Log in</a>
                </p>
            </div>
        </div>
    </main>

    <script src="../../js/core/utils.js"></script>
    <script src="../../js/data/storage.js"></script>
    <script src="../../js/data/seed-loader.js"></script>
    <script src="../../js/auth/session.js"></script>
    <script src="../../js/auth/auth.js"></script>
    <script>
        document.getElementById("signupForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const alertEl = document.getElementById("authAlert");
            alertEl.style.display = "none";

            const selectedRole = document.querySelector('input[name="role"]:checked').value;
            const result = AuthController.signup({
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                password: document.getElementById("password").value,
                role: selectedRole
            });

            if (result.success) {
                AuthController.redirectByRole(result.user);
            } else {
                alertEl.textContent = result.message;
                alertEl.style.display = "block";
            }
        });
    </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Artisan</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="../../index.html" class="brand">
                <span class="brand-mark">A</span>
                <span class="brand-name">Artisan</span>
            </a>
        </div>
    </header>

    <main class="section">
        <div class="container" style="max-width: 800px;">
            <h2>Checkout</h2>

            <div style="display: grid; grid-template-columns: 3fr 2fr; gap: 30px; margin-top: 24px;" id="checkoutWrapper">
                <div>
                    <form id="checkoutForm" class="metric-card">
                        <h3 style="margin-bottom: 16px;">1. Shipping Address</h3>
                        
                        <div class="form-group">
                            <label class="form-label" for="address">Street Address</label>
                            <input type="text" id="address" class="form-control" required placeholder="123 Main Street, Apt 4B">
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                            <div class="form-group">
                                <label class="form-label" for="city">City</label>
                                <input type="text" id="city" class="form-control" required placeholder="Mumbai">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="pincode">Pincode</label>
                                <input type="text" id="pincode" class="form-control" required placeholder="400001">
                            </div>
                        </div>

                        <h3 style="margin-top: 24px; margin-bottom: 16px;">2. Payment Method</h3>
                        <div class="form-group">
                            <select id="paymentMethod" class="form-control">
                                <option value="UPI">UPI / Google Pay / PhonePe</option>
                                <option value="Card">Credit / Debit Card</option>
                                <option value="NetBanking">Net Banking</option>
                                <option value="COD">Cash on Delivery</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary btn-large" style="width: 100%; margin-top: 20px;">Complete Simulated Purchase</button>
                    </form>
                </div>

                <div class="metric-card" style="height: fit-content;">
                    <h3 style="margin-bottom: 16px;">Summary</h3>
                    <div id="checkoutSummaryItems" style="margin-bottom: 15px;"></div>
                    <hr style="border: 0; border-top: 1px solid var(--color-border); margin-bottom: 15px;">
                    <div style="display: flex; justify-content: space-between;">
                        <strong>Total Amount</strong>
                        <strong id="checkoutTotal" style="color: var(--color-primary); font-size: 1.2rem;">₹0.00</strong>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../../js/core/utils.js"></script>
    <script src="../../js/data/storage.js"></script>
    <script src="../../js/data/seed-loader.js"></script>
    <script src="../../js/data/data-service.js"></script>
    <script src="../../js/auth/session.js"></script>
    <script src="../../js/cart/cart.js"></script>
    <script src="../../js/orders/orders.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const user = SessionManager.getUser();
            if (!user) {
                window.location.href = "../auth/login.html";
                return;
            }
            if (user.role !== "buyer") {
                window.location.href = "marketplace.html";
                return;
            }

            const summary = CartEngine.getSummary();
            const summaryContainer = document.getElementById("checkoutSummaryItems");
            const totalEl = document.getElementById("checkoutTotal");

            if (!summary.items || summary.items.length === 0) {
                window.location.href = "cart.html";
                return;
            }

            totalEl.textContent = formatCurrency(summary.subtotal);
            summaryContainer.innerHTML = summary.items.map(item => `
                <div style="display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 8px;">
                    <span>${escapeHTML(item.product.name)} (x${item.quantity})</span>
                    <strong>${formatCurrency(item.lineTotal)}</strong>
                </div>
            `).join("");

            document.getElementById("checkoutForm").addEventListener("submit", (e) => {
                e.preventDefault();

                const shippingDetails = {
                    address: document.getElementById("address").value,
                    city: document.getElementById("city").value,
                    pincode: document.getElementById("pincode").value
                };
                const paymentMethod = document.getElementById("paymentMethod").value;

                const result = OrderEngine.createOrder(shippingDetails, paymentMethod);

                if (result.success) {
                    const wrapper = document.getElementById("checkoutWrapper");
                    wrapper.innerHTML = `
                        <div class="metric-card" style="grid-column: 1 / -1; text-align: center; padding: 40px;">
                            <span class="badge badge-success" style="font-size: 1rem; padding: 6px 16px;">Payment Successful</span>
                            <h2 style="margin-top: 16px;">Order #${result.orderId} Confirmed!</h2>
                            <p style="margin-top: 8px; color: var(--color-text-muted);">Thank you for supporting independent women artisans.</p>
                            <a href="marketplace.html" class="btn btn-primary" style="margin-top: 24px;">Back to Marketplace</a>
                        </div>
                    `;
                } else {
                    alert(result.message || "Something went wrong placing your order. Please try again.");
                    if (!SessionManager.getUser()) {
                        window.location.href = "../auth/login.html";
                    }
                }
            });
        });
    </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Artisan</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="../../index.html" class="brand">
                <span class="brand-mark">A</span>
                <span class="brand-name">Artisan</span>
            </a>
            <nav class="main-nav" aria-label="Main navigation"></nav>
            <button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-label="Open navigation menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main class="section">
        <div class="container" id="productContainer">
            <!-- Dynamic Data Rendered via DataService -->
        </div>
    </main>

    <script src="../../js/core/utils.js"></script>
    <script src="../../js/data/storage.js"></script>
    <script src="../../js/data/seed-loader.js"></script>
    <script src="../../js/data/data-service.js"></script>
    <script src="../../js/auth/session.js"></script>
    <script src="../../js/auth/auth.js"></script>
    <script src="../../js/cart/cart.js"></script>
    <script src="../../js/cart/cart-ux.js"></script>
    <script src="../../js/nav/navigation.js"></script>
    <script src="../../js/core/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const productId = params.get("id");
            const container = document.getElementById("productContainer");

            const product = DataService.getProductById(productId);
            if (!product) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <h2>Product not found</h2>
                        <p style="margin-top: 10px;"><a href="marketplace.html" class="text-link">Return to marketplace catalog</a></p>
                    </div>
                `;
                return;
            }

            const seller = DataService.getSellerById(product.sellerId);
            const stock = (typeof product.stock === "number") ? product.stock : parseInt(product.stock, 10);
            const inStock = !isNaN(stock) ? stock > 0 : true; // if stock isn't tracked for this product, don't block purchase
            const stockLabel = !isNaN(stock)
                ? (stock > 0 ? `${stock} in stock` : "Out of stock")
                : "";

            const currentUser = SessionManager.getUser();
            const isGuest = !currentUser;
            const isSeller = currentUser && currentUser.role === "seller";
            const canBuy = !isGuest && !isSeller;

            container.innerHTML = `
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start;">
                    <div style="aspect-ratio: 1; background: var(--color-surface-soft); border-radius: var(--radius-large); display: grid; place-items: center; border: 1px solid var(--color-border);">
                        <span style="font-family: 'Manrope'; font-weight: 700; color: var(--color-text-muted);">${escapeHTML(product.category || "Handcrafted")}</span>
                    </div>

                    <div>
                        <span class="badge badge-success">${escapeHTML(product.category || "General")}</span>
                        <h1 style="font-size: 2.2rem; margin-top: 12px;">${escapeHTML(product.name)}</h1>
                        
                        <p style="margin-top: 8px;">Made by <a href="seller-store.html?id=${seller ? seller.id : ''}" class="text-link"><strong>${escapeHTML(seller ? seller.storeName : "Independent Artisan")}</strong></a></p>

                        <h2 style="font-size: 2rem; color: var(--color-primary); margin-top: 20px;">${formatCurrency(product.price)}</h2>

                        ${stockLabel ? `<p style="margin-top: 8px; font-size: 0.9rem; color: ${inStock ? 'var(--color-text-muted)' : 'var(--color-error)'};">${escapeHTML(stockLabel)}</p>` : ""}

                        <p style="margin-top: 20px; color: var(--color-text-secondary); line-height: 1.6;">${escapeHTML(product.description || 'Authentic product handcrafted by independent women entrepreneurs.')}</p>

                        ${isSeller ? `
                            <p style="margin-top: 30px; color: var(--color-text-muted); font-size: 0.9rem;">Sellers cannot purchase products. Log out and use a buyer account to add items to cart.</p>
                        ` : isGuest ? `
                            <div style="margin-top: 30px;">
                                <button class="btn btn-primary btn-large" style="width: 100%;" id="addToCartBtn">Add to Cart</button>
                            </div>
                        ` : !inStock ? `
                            <div style="margin-top: 30px;">
                                <button class="btn btn-secondary" style="width: 100%;" disabled>Out of Stock</button>
                            </div>
                        ` : `
                            <div style="margin-top: 30px; display: flex; gap: 15px; align-items: center;">
                                <input type="number" id="productQty" min="1" ${!isNaN(stock) ? `max="${stock}"` : ""} value="1" style="width: 70px; padding: 10px; text-align: center;">
                                <button class="btn btn-primary btn-large" style="flex: 1;" id="addToCartBtn">Add to Cart</button>
                            </div>
                        `}
                    </div>
                </div>
            `;

            const addBtn = document.getElementById("addToCartBtn");
            if (addBtn) {
                addBtn.addEventListener("click", () => {
                    if (!canBuy) {
                        showLoginPrompt(isGuest ? "guest" : "seller");
                        return;
                    }

                    const qtyInput = document.getElementById("productQty");
                    let qty = parseInt(qtyInput.value, 10);
                    if (isNaN(qty) || qty < 1) qty = 1;
                    if (!isNaN(stock) && qty > stock) qty = stock;

                    CartEngine.addItem(product.id, qty);
                    if (typeof updateCartBadge === "function") updateCartBadge();
                    if (typeof showToast === "function") {
                        showToast(`Added ${qty} item(s) to cart.`, "success");
                    }
                });
            }
        });
    </script>
</body>
</html>

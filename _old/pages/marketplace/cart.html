
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Artisan</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="../../index.html" class="brand">
                <span class="brand-mark">A</span>
                <span class="brand-name">Artisan</span>
            </a>
            <nav class="main-nav" aria-label="Main navigation"></nav>
            <button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-label="Open navigation menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main class="section">
        <div class="container" id="cartPageContainer">
            <h2>Your Shopping Cart</h2>

            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 30px; margin-top: 24px;">
                <div id="cartItemsContainer">
                    <!-- Line items populated by JS -->
                </div>

                <div class="metric-card" style="height: fit-content;">
                    <h3 style="margin-bottom: 16px;">Order Summary</h3>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <span>Subtotal</span>
                        <strong id="cartSubtotal">₹0.00</strong>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                        <span>Estimated Shipping</span>
                        <span style="color: var(--color-success); font-weight: 600;">FREE</span>
                    </div>
                    <hr style="border: 0; border-top: 1px solid var(--color-border); margin-bottom: 20px;">
                    <a href="checkout.html" id="checkoutBtn" class="btn btn-primary btn-large" style="width: 100%; text-align: center;">Proceed to Checkout</a>
                </div>
            </div>
        </div>
    </main>

    <script src="../../js/core/utils.js"></script>
    <script src="../../js/data/storage.js"></script>
    <script src="../../js/data/seed-loader.js"></script>
    <script src="../../js/data/data-service.js"></script>
    <script src="../../js/auth/session.js"></script>
    <script src="../../js/auth/auth.js"></script>
    <script src="../../js/cart/cart.js"></script>
    <script src="../../js/toast.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/nav.js"></script>
    <script src="../../js/core/app.js"></script>
    <script src="../../js/pages/buyer/cart.js"></script>
    
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Artisan</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">

</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="../../index.html" class="brand">
                <span class="brand-mark">A</span>
                <span class="brand-name">Artisan</span>
            </a>
            <nav class="main-nav" aria-label="Main navigation"></nav>
            <button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-label="Open navigation menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main class="section">
        <div class="container" style="max-width: 800px;">
            <h2>My Order History</h2>
            <p style="margin-bottom: 24px; color: var(--color-text-muted);">Track your past purchases and support for artisan makers.</p>

            <div class="form-group" style="margin-bottom: 24px;">
                <label class="form-label" for="orderSearch">Search by order number</label>
                <input type="text" id="orderSearch" class="form-control" placeholder="e.g. ord_0042" style="max-width: 320px;">
            </div>

            <div id="buyerOrdersContainer">
                <!-- Dynamically populated -->
            </div>
        </div>
